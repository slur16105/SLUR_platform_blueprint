<!DOCTYPE html>
<html lang="ko">
<head>
	<title>SLUR - 관리자</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" type="text/css" href="../common/css/common.css" />
	<link rel="stylesheet" type="text/css" href="../common/css/responsive.css" />
	<script type="text/javascript" src="../common/js/jquery-1.11.1.min.js"></script>
	<script type="text/javascript" src="../common/js/slick.min.js"></script>
	<script type="text/javascript" src="../common/js/ui.js"></script>
</head>
<body>
	<div id="login_wrap">

        <section class="login_box">
            <h1 class="logo"><span class="blind">SLUR</span></h1>
            <div class="it_box_01">
                <div><label for="id_mail">아이디(이메일)</label> <input type="text" id="id_mail" class="it" placeholder="관리자 이메일 주소를 입력해주세요."></div>
                <div><label for="pw">비밀번호</label> <input type="password" id="pw" class="it" placeholder="비밀번호를 입력해주세요."></div>
            </div>
            <div class="it_box_02">
                <label class="checkbox"><input type="checkbox"><em></em><span>아이디저장</span></label>
                <a href="#self" class="btn_find_pw">비밀번호 찾기</a>
            </div>
            <a href="#self" class="btn_login">로그인</a>
        </section><!-- class : login_box -->

		<footer class="footer">
			<p class="copyright">copyright 2020. SLUR ALL Rights Reserved.</p>
			<a href="#self" class="btn_terms">이용약관</a>
		</footer><!-- class : footer -->

        <div id="all_menu">
            <div class="menu"></div>
            <button type="button" class="btn_close"><span>닫기</span></button>
        </div>

	</div><!-- id : wrap -->
</body>
</html>
