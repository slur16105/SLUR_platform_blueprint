[project]
name = "slur-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.*",
    "asyncpg==0.31.*",
    "fastapi==0.139.*",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]==2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
