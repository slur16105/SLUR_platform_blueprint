<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="로컬 데모 히어로 이미지">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ece2"/>
      <stop offset="1" stop-color="#e8e0d3"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ddd2c0"/>
      <stop offset="1" stop-color="#d2c6b1"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b4f3e" stop-opacity="0.16"/>
    </radialGradient>
  </defs>

  <!-- 지면 배경 -->
  <rect width="1600" height="900" fill="url(#paper)"/>

  <!-- 테이블 표면 -->
  <rect x="0" y="592" width="1600" height="308" fill="url(#surface)"/>
  <line x1="0" y1="592" x2="1600" y2="592" stroke="#c7b99f" stroke-width="1.5"/>

  <!-- 뒤쪽 큰 정물 (도자 오브제) -->
  <g>
    <ellipse cx="812" cy="600" rx="150" ry="26" fill="#000" opacity="0.06"/>
    <path d="M712 596 C712 470 742 356 812 356 C882 356 912 470 912 596 Z" fill="#c9a98c"/>
    <path d="M712 596 C712 470 742 356 812 356 C846 356 872 470 872 596 Z" fill="#d8bda3" opacity="0.55"/>
    <ellipse cx="812" cy="356" rx="100" ry="18" fill="#b8946f"/>
    <ellipse cx="812" cy="352" rx="82" ry="12" fill="#a07c5b"/>
  </g>

  <!-- 왼쪽 낮은 그릇 -->
  <g>
    <ellipse cx="470" cy="612" rx="150" ry="24" fill="#000" opacity="0.06"/>
    <path d="M348 560 C360 636 580 636 592 560 C560 590 380 590 348 560 Z" fill="#9aa39a"/>
    <ellipse cx="470" cy="560" rx="122" ry="22" fill="#aeb6ac"/>
    <ellipse cx="470" cy="558" rx="98" ry="15" fill="#8c968c"/>
  </g>

  <!-- 오른쪽 길쭉한 병 -->
  <g>
    <ellipse cx="1128" cy="616" rx="70" ry="18" fill="#000" opacity="0.06"/>
    <rect x="1104" y="300" width="48" height="70" rx="10" fill="#7d8a86"/>
    <path d="M1092 366 C1092 356 1164 356 1164 366 L1176 470 C1180 566 1076 566 1080 470 Z" fill="#8b9793"/>
    <path d="M1092 366 C1092 356 1128 356 1128 360 L1130 470 C1132 560 1092 560 1088 470 Z" fill="#9aa5a1" opacity="0.5"/>
  </g>

  <!-- 앞쪽 작은 오브제 두 점 -->
  <g>
    <ellipse cx="628" cy="672" rx="66" ry="12" fill="#000" opacity="0.06"/>
    <circle cx="628" cy="636" r="40" fill="#caa06f"/>
    <circle cx="616" cy="626" r="13" fill="#dcb98d" opacity="0.6"/>
  </g>
  <g>
    <ellipse cx="960" cy="686" rx="88" ry="14" fill="#000" opacity="0.06"/>
    <rect x="892" y="628" width="136" height="52" rx="12" fill="#b9b0a0"/>
    <rect x="892" y="628" width="136" height="18" rx="9" fill="#cbc3b4"/>
  </g>

  <!-- 부드러운 비네트 -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
