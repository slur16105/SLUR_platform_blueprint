# Hub맥 로컬 서비스 스택. Railway의 api/web + pre-deploy Alembic 구성을 재현한다.
# 실제 비밀값은 Git 제외 .env에만 둔다. 최초에는 `cp .env.example .env` 후 값을 생성한다.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: slur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: slur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slur -d slur"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Railway의 preDeployCommand를 대체한다. 매번 schema를 head까지 올린 뒤 0으로 종료한다.
  migrate:
    build: ./apps/api
    command: uv run --no-sync alembic upgrade head
    environment: &api_environment
      DATABASE_URL: postgresql+asyncpg://slur:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/slur
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: local
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_APP_ID: ${KAKAO_APP_ID:-0}
      # Pydantic list 설정이므로 값은 .env에서 JSON 배열로 제공한다.
      KAKAO_REDIRECT_URIS: ${KAKAO_REDIRECT_URIS:?Set KAKAO_REDIRECT_URIS in .env as a JSON array}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    restart: unless-stopped
    environment: *api_environment
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health').read()"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 기본 기동에서는 실행하지 않는 로컬 검증 도구. Supabase가 아닌 Docker Postgres에만 데모 데이터를 만든다.
  seed:
    profiles: ["tools"]
    build: ./apps/api
    command: uv run --no-sync python -m app.local_seed
    environment: *api_environment
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:3000/api/auth/kakao/callback}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
