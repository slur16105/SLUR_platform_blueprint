services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: slur
      POSTGRES_PASSWORD: slur
      POSTGRES_DB: slur
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slur -d slur"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://slur:slur@postgres:5432/slur
      ENVIRONMENT: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
