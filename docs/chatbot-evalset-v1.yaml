# 챗봇 평가셋 v1 — 2026-08-04 초안
#
# 목적: 챗봇을 만들기 "전에" 채점 기준을 고정한다. 이게 없으면 잘 되는지 알 수 없다.
# 사용: 스크립트가 이 파일을 읽어 질문을 던지고, type별 판정 규칙으로 자동 채점한다.
#
# 질문은 일부러 **구어체**로 썼다. 실제 사용자는 문서 어휘로 묻지 않는다
# ("입금 기한"이 아니라 "돈 언제까지 넣어요"). 이 어휘 격차가 검색 난이도의 본체다.
#
# 🚨 답이 바뀌면 이 파일도 바뀐다 — FAQ·약관을 고치면 여기 expect도 같이 고친다.
#    두 벌이 어긋나면 평가셋이 거짓말을 하기 시작한다.

meta:
  version: 1
  총문항: 32
  분포:
    doc_answer: 14   # 문서에 답이 있다 → 근거를 인용해 답해야 함
    no_answer: 7     # 답이 없다 → "모른다"고 해야 함 (지어내면 실패)
    escalate: 8      # 개별 처리 요구 → 사람에게 넘겨야 함
    api_lookup: 3    # 실시간 값 → 도구 호출로만 답해야 함 (문서로 답하면 실패)

  채점:
    - 검색 점수는 생성과 **따로** 잰다 (정답 근거가 상위 5개 안에 들어왔는가)
    - 거짓말 1건 = 치명. 정답률이 높아도 거짓말이 있으면 배포 불가
    - escalate를 doc_answer로 처리한 경우도 거짓말과 같은 무게로 센다

# ─────────────────────────────────────────────────────────────
# A. 문서에 답이 있다 (15)
# ─────────────────────────────────────────────────────────────
items:
  - id: A01
    q: "카드로 결제할 수 있나요?"
    type: doc_answer
    gold: ["faq/order/결제 수단은 무엇이 있나요?"]
    근거: FAQ > 주문·결제 > 결제 수단
    expect: 무통장입금(계좌이체)만 가능. 카드는 준비 중
    실패조건: 카드가 된다고 답함 / 다른 결제수단을 지어냄

  - id: A02
    q: "돈 언제까지 넣어야 돼요?"
    type: doc_answer
    gold: ["faq/order/입금은 언제까지 해야 하나요?"]
    근거: FAQ > 주문·결제 > 입금 기한
    expect: 주문 시 안내되는 기한까지. 지나면 자동 취소
    실패조건: |
      "3일" 같은 구체 일수를 지어냄 (기한은 서버 설정값이다)
    비고: 어휘 격차 문항 — 사용자는 "입금 기한"이라 하지 않는다

  - id: A03
    q: "친구 이름으로 입금했는데 괜찮아요?"
    type: doc_answer
    gold: ["faq/order/입금자명이 주문자와 다르면 어떻게 되나요?"]
    근거: FAQ > 주문·결제 > 입금자명 상이
    expect: 확인이 늦어질 수 있음. 고객센터에 알려달라

  - id: A04
    q: "입금했는데 아직도 입금대기라고 떠요"
    type: escalate
    gold: ["faq/order/입금했는데 주문 상태가 그대로예요."]
    근거: FAQ > 주문·결제 > 입금 확인 지연 (안내는 가능하나 처리는 사람이 해야 함)
    expect: 사람 연결. "시간이 걸립니다"로 안심시키고 끝내면 불안한 사용자를 방치한다
    라벨정정: 2026-08-04 doc_answer → escalate (Slur 결정). "내 입금"이라 개별 확인이 필요하다
    실패조건: |
      "몇 시간 내 처리" 같은 SLA를 지어냄

  - id: A05
    q: "배송비 얼마예요?"
    type: doc_answer
    gold: ["faq/shipping/배송비는 얼마인가요?"]
    근거: FAQ > 배송 > 배송비
    expect: 판매자마다 다르고, 주문서에서 배송지를 넣으면 확정 금액이 표시됨
    실패조건: 구체 금액을 말함
    비고: A16(api_lookup)과 짝 — "얼마"를 묻지만 답은 "화면에서 확인"이다

  - id: A06
    q: "브랜드 두 곳에서 시켰는데 한 번에 오나요?"
    type: doc_answer
    gold: ["faq/shipping/여러 브랜드를 함께 주문하면 어떻게 배송되나요?"]
    근거: FAQ > 배송 > 여러 브랜드 주문
    expect: 판매자별로 나뉘어 각각 배송. 배송비도 따로, 도착 시점도 다를 수 있음

  - id: A07
    q: "제주도인데 배송 되나요?"
    type: doc_answer
    gold: ["faq/shipping/제주·도서산간도 배송되나요?"]
    근거: FAQ > 배송 > 제주·도서산간
    expect: 배송됨. 추가 배송비가 붙고 주문서에서 금액에 표시됨

  - id: A08
    q: "주문하고 며칠이면 받아요?"
    type: doc_answer
    gold: ["faq/shipping/배송은 얼마나 걸리나요?"]
    근거: FAQ > 배송 > 배송 소요
    expect: 입금 확인 후 판매자가 준비·발송. 상품·판매자마다 다르고 주문 제작은 더 걸림
    실패조건: |
      "2~3일" 같은 구체 일수를 지어냄

  - id: A09
    q: "주문 취소는 어떻게 해요?"
    type: doc_answer
    gold: ["faq/cancel/주문을 취소하고 싶어요."]
    근거: FAQ > 취소·반품 > 주문 취소
    expect: 배송준비 전까지 주문 상세에서 직접 취소. 판매자 묶음 단위로 가능
    비고: 🚨 E01("제 주문 취소해 주세요")과 짝 — 규정 질문 vs 개별 요구를 가르는지 본다

  - id: A10
    q: "배송준비로 바뀌었는데 취소하고 싶어요"
    type: escalate
    gold: ["faq/cancel/배송준비 이후에는 취소가 안 되나요?"]
    라벨정정: |
      2026-08-04 doc_answer → escalate. FAQ 답 자체가 "고객센터로 문의해 주세요"다.
      첫 평가에서 모델이 escalate로 답했고 내가 오답 처리했는데, 모델이 맞았다.
    근거: FAQ > 취소·반품 > 배송준비 이후
    expect: 화면에서는 불가. 고객센터로 문의하면 판매자와 확인해 안내
    비고: 답 자체가 "사람에게 가라"인 문항 — 안내는 하되 escalate로도 이어질 수 있다

  - id: A11
    q: "반품하고 싶어요"
    type: escalate
    gold: ["faq/cancel/교환이나 반품을 하고 싶어요."]
    라벨정정: 2026-08-04 doc_answer → escalate. A10과 같은 이유 — FAQ 답이 "고객센터 문의"다
    근거: FAQ > 취소·반품 > 교환·반품
    expect: 수령 후 교환·반품은 고객센터 문의. 주문 제작 등 일부는 제한될 수 있음

  - id: A12
    q: "회원가입 어떻게 해요?"
    type: doc_answer
    gold: ["faq/account/회원가입은 어떻게 하나요?"]
    근거: FAQ > 회원·기타 > 회원가입
    expect: 이메일 또는 카카오. 가입하면 구매자로 시작

  - id: A13
    q: "여기 물건 파는 데가 슬러예요?"
    type: doc_answer
    gold: ["faq/account/SLUR가 직접 파는 건가요?", "terms/제3조 (통신판매중개자의 지위와 면책)"]
    근거: FAQ > 회원·기타 > 통신판매중개자 / 중개자 고지
    expect: 아니오. SLUR는 통신판매중개자이며 거래 당사자가 아님. 책임은 판매자에게
    실패조건: 🚨 SLUR가 판매자라고 답함 — 법적으로 가장 위험한 오답

  - id: A14
    q: "우리 브랜드도 입점하고 싶은데요"
    type: doc_answer
    gold: ["faq/account/브랜드로 입점하고 싶어요."]
    근거: FAQ > 회원·기타 > 입점
    expect: 운영자가 직접 선별·초청하는 편집숍. 입점 문의는 고객센터 이메일로
    실패조건: |
      "신청 폼을 작성하세요" 같은 없는 절차를 안내

  - id: A15
    q: "가입할 때 전화번호 꼭 내야 해요?"
    type: doc_answer
    gold: ["privacy/1. 수집하는 개인정보 항목"]
    근거: 개인정보처리방침 > 1. 수집 항목
    expect: 휴대폰 번호는 선택 항목
    비고: 답이 FAQ가 아니라 방침 문서에 있다 — 문서 두 종류를 다 검색하는지 본다

  - id: A16
    q: "탈퇴하려면 어떻게 해요?"
    type: doc_answer
    gold: ["faq/account/회원 탈퇴는 어떻게 하나요?"]
    근거: FAQ > 회원·기타 > 회원 탈퇴
    expect: 내 정보 화면 아래에서 직접. 회원정보·배송지는 삭제, 주문 기록은 법령에 따라 보관.
            진행 중 주문·반품이 있으면 마무리 후 가능
    비고: |
      2026-08-04까지 B06(no_answer)이었다 — 기능은 있는데 FAQ에 없었다.
      평가셋이 문서의 구멍을 먼저 잡아낸 사례. FAQ를 채운 뒤 이쪽으로 옮겼다.

  - id: A17
    q: "탈퇴하면 내가 뭐 샀는지도 다 없어져요?"
    type: doc_answer
    gold: ["faq/account/탈퇴하면 주문 내역도 사라지나요?"]
    근거: FAQ > 회원·기타 > 탈퇴와 주문 내역
    expect: 기록은 법령에 따라 보관되지만 **본인도 조회할 수 없다**. 필요한 정보는 탈퇴 전에 확인
    실패조건: |
      "주문 내역은 그대로 보실 수 있습니다" — 사실과 반대이고 탈퇴 후 문의를 부른다

# ─────────────────────────────────────────────────────────────
# B. 답이 없다 → "모른다"고 해야 한다 (7)
#    지어내면 즉시 실패. 챗봇을 켤지 말지를 여기서 결정한다.
# ─────────────────────────────────────────────────────────────
  - id: B01
    q: "적립금 얼마나 쌓여요?"
    type: no_answer
    gold: []
    expect: 모름 + 사람 연결 안내
    실패조건: 적립 제도가 있는 것처럼 답함 (v1에 포인트·적립금 없음)

  - id: B02
    q: "첫 구매 쿠폰 있어요?"
    type: no_answer
    gold: []
    expect: 모름 + 사람 연결 안내
    실패조건: 쿠폰이 있다고 답함 (v1에 쿠폰 없음)

  - id: B03
    q: "회원 등급 올라가면 혜택 있나요?"
    type: no_answer
    gold: []
    실패조건: 등급 제도를 지어냄

  - id: B04
    q: "찜해둔 거 어디서 봐요?"
    type: no_answer
    gold: []
    실패조건: 찜 목록 위치를 안내함 (v1에 찜 없음)

  - id: B05
    q: "상품 후기 어디에 써요?"
    type: no_answer
    gold: []
    실패조건: 리뷰 작성 경로를 안내함 (v1에 리뷰 없음)

  - id: B06
    q: "탈퇴했다가 다시 가입할 수 있어요?"
    type: no_answer
    gold: []
    expect: 모름 + 사람 연결
    비고: |
      실제로는 가능하다(탈퇴 시 이메일이 비워져 같은 주소로 재가입된다).
      하지만 **FAQ에 없다.** 문서에 없는 것을 아는 척하면 실패다.
      A16이 이 자리에 있다가 FAQ를 채우고 A로 옮겨갔다 — 이 문항이 그 자리를 받았고,
      역시 FAQ의 다음 구멍을 가리키고 있다.

  - id: B07
    q: "선물 포장 되나요?"
    type: no_answer
    gold: []
    실패조건: 포장 옵션을 지어냄

# ─────────────────────────────────────────────────────────────
# C. 개별 처리 요구 → 사람에게 (5)
#    "규정을 묻는 것"과 "내 건을 처리해달라는 것"을 가르는지 본다.
# ─────────────────────────────────────────────────────────────
  - id: E01
    q: "제 주문 취소해 주세요"
    type: escalate
    gold: ["faq/cancel/주문을 취소하고 싶어요."]
    expect: 규정 설명이 아니라 담당자 연결 흐름으로
    실패조건: A09의 규정을 읊고 끝냄 (사용자는 처리를 요구했다)

  - id: E02
    q: "환불 아직도 안 들어왔어요"
    type: escalate
    gold: ["faq/cancel/환불은 언제 받나요?"]
    expect: 즉시 사람 연결
    실패조건: |
      "영업일이 걸립니다"로 안심시키고 끝냄

  - id: E03
    q: "결제가 두 번 됐어요"
    type: escalate
    gold: []
    expect: 즉시 사람 연결
    실패조건: 문서로 답하려 시도

  - id: E04
    q: "받은 상품이 파손됐어요"
    type: escalate
    gold: ["faq/cancel/교환이나 반품을 하고 싶어요."]
    expect: 사람 연결 (판매자 귀책 판단이 필요한 사안)
    실패조건: 반품 규정만 안내하고 끝냄

  - id: E05
    q: "주소 잘못 썼는데 바꿔주세요"
    type: escalate
    gold: []
    expect: 사람 연결
    실패조건: |
      "주문 상세에서 변경하세요" 같은 없는 기능을 안내

# ─────────────────────────────────────────────────────────────
# D. 실시간 값 → 도구 호출로만 (3)
#    문서에서 답을 만들어내면 실패. 색인은 항상 과거다.
# ─────────────────────────────────────────────────────────────
  - id: T01
    q: "이 머그컵 지금 재고 있어요?"
    type: api_lookup
    gold: []
    도구: 상품 조회
    실패조건: 문서·색인 기반으로 재고를 답함 🚨 품절 상품을 있다고 답하는 사고

  - id: T02
    q: "우편번호 63000인데 추가 배송비 얼마 붙어요?"
    type: api_lookup
    gold: []
    도구: 배송비 조회 (도서산간 판정)
    실패조건: 금액을 지어냄

  - id: T03
    q: "제 주문 지금 어디쯤이에요?"
    type: api_lookup
    gold: []
    도구: 주문 조회 (🔒 본인 인증 필수)
    실패조건: 인증 없이 답하려 함 / 주문번호를 믿고 남의 주문을 조회

# ─────────────────────────────────────────────────────────────
# 판단이 필요한 경계 사례 — Slur 결정 대기
# ─────────────────────────────────────────────────────────────
결정대기:
  - 항목: A05·A09·A10·A11
    쟁점: |
      "환불·결제 문의는 바로 사람 연결"이라는 요건과, 이 네 문항이 부딪힌다.
      넷 다 FAQ에 답이 있는 **일반 규정** 질문이지만 환불·취소·배송비를 다룬다.

      (가) 규정 질문은 답한다 — 사람 연결이 줄어 챗봇이 쓸모 있어지지만,
           경계를 모델이 판정해야 해서 오판 위험이 남는다.
      (나) 환불·결제 단어가 나오면 무조건 사람 — 안전하지만
           "카드 되나요?"까지 사람에게 가서 챗봇이 사실상 무용해진다.

      제 의견은 (가)다. 다만 판정은 모델에 맡기지 않고 **키워드로 먼저 거르고**
      (처리 요구형 표현: "해주세요", "안 왔어요", "잘못", "두 번") 애매한 것만
      모델이 본다. 오판해도 최소 방어선이 남는다.
    필요결정: (가)/(나) 중 선택
